name: Release

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    
    steps:
      - name: Update packages
        run: |
          sudo -n apt-get update
          sudo -n apt-get upgrade -y git build-essential
          
      - name: Install libnx
        run: |
          git config --global --add safe.directory "*"
          git clone --depth 1 --branch latest https://github.com/switchbrew/libnx.git
          cd libnx
          make install -j$(nproc)
          
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          submodules: recursive
          
      - name: Get version
        id: version
        run: |
          VER_FILE=Application/Makefile
          VERSION=$(awk '/^VER_MAJOR/{printf $3}' $VER_FILE).$(awk '/^VER_MINOR/{printf $3}' $VER_FILE).$(awk '/^VER_MICRO/{printf $3}' $VER_FILE)
          echo "TAG=v${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_NAME=NX-Activity-Log v${VERSION}" >> $GITHUB_ENV
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "release_name=NX-Activity-Log v${VERSION}" >> $GITHUB_OUTPUT
          
      - name: Build application
        run: |
          export DEVKITPRO=/opt/devkitpro
          make -j$(nproc)
          
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp ./sdcard/switch/NX-Activity-Log/NX-Activity-Log.nro artifact/
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nx-activity-log-${{ env.TAG }}
          path: artifact/NX-Activity-Log.nro

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: success()
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nx-activity-log-${{ needs.build.outputs.tag }}
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          release_name: ${{ needs.build.outputs.release_name }}
          generate_release_notes: true
          files: NX-Activity-Log.nro